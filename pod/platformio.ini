; PlatformIO Project Configuration File
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DDEBUG
test_filter = test_embedded
test_build_src = yes
lib_deps =
	adafruit/Adafruit GFX Library
	adafruit/Adafruit BME280 Library
	throwtheswitch/Unity@^2.6.1

[env:rp2350]
platform = raspberrypi
board = rpipico2
framework = arduino
monitor_speed = 115200
lib_deps =
	adafruit/Adafruit GFX Library
	adafruit/Adafruit BME280 Library

[env:native]
platform = native
build_flags = -DNATIVE_TEST -std=c++11 -DUNITY_SUPPORT_64
build_src_filter =
    +<algorithms/*>
    +<sensors/GpsBuffer.cpp>
    +<sensors/WeatherBuffer.cpp>
    +<sensors/Bme280Reader.cpp>
    +<BuzzerController.cpp>
    +<LogFormatter.cpp>
    +<sensors/SensorData.h>
    +<display/NativeFramebuffer.cpp>
    +<nijntje/NijntjeRenderer.cpp>
    +<nijntje/NijntjeSpriteRegistry.cpp>
    +<model/ModelManifest.cpp>
    +<model/ModelEvaluator.cpp>
    +<storage/SdLogger.cpp>
test_build_src = yes
test_filter =
    test_math
    test_algorithms
    test_nijntje
    test_log
    test_display
    test_model
    test_storage
lib_deps =
	throwtheswitch/Unity

[env:esp32_i2c_scan]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DI2C_SCAN
build_src_filter =
    +<../test/test_display_stream/i2c_scan.cpp>

[env:esp32_stream]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DDEBUG
build_src_filter =
    +<algorithms/*>
    +<sensors/GpsBuffer.cpp>
    +<sensors/WeatherBuffer.cpp>
    +<sensors/RtcReader.cpp>
    +<sensors/Bme280Reader.cpp>
    +<GpsReader.cpp>
    +<LogFormatter.cpp>
    +<../test/test_display_stream/main_stream.cpp>
lib_deps =
    adafruit/Adafruit BME280 Library

[env:native_display]
platform = native
build_flags =
    -DNATIVE_DISPLAY
    -std=c++17
extra_scripts = pre:scripts/link_sdl3.py
build_src_filter =
    +<algorithms/NijntjeEvaluator.cpp>
    +<algorithms/MathUtils.cpp>
    +<display/NativeFramebuffer.cpp>
    +<display/SDL2Display.cpp>
    +<nijntje/NijntjeRenderer.cpp>
    +<nijntje/NijntjeSpriteRegistry.cpp>
    +<main_display_sim.cpp>
