; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DDEBUG
test_filter = test_embedded
test_build_src = yes
lib_deps =
	adafruit/Adafruit GFX Library
	adafruit/Adafruit BMP085 Library
	throwtheswitch/Unity@^2.6.1

[env:rp2350]
platform = raspberrypi
board = rpipico2
framework = arduino
monitor_speed = 115200

[env:native]
platform = native
build_flags = -DNATIVE_TEST -std=c++11
build_src_filter =
    +<algorithms/*>
    +<sensors/GpsBuffer.cpp>
    +<sensors/WeatherBuffer.cpp>
    +<LogFormatter.cpp>
    +<BuzzerController.cpp>
    +<sensors/SensorData.h>
    +<display/NativeFramebuffer.cpp>
    +<nijntje/NijntjeRenderer.cpp>
    +<nijntje/NijntjeSpriteRegistry.cpp>
test_build_src = yes
test_filter =
    test_math
    test_algorithms
    test_nijntje
    test_log
    test_display
lib_deps =
	throwtheswitch/Unity

[env:esp32_i2c_scan]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DI2C_SCAN
build_src_filter =
    +<../test/test_display_stream/i2c_scan.cpp>

[env:esp32_stream]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DDEBUG
build_src_filter =
    +<algorithms/*>
    +<sensors/GpsBuffer.cpp>
    +<sensors/WeatherBuffer.cpp>
    +<sensors/RtcReader.cpp>
    +<sensors/Bmp180Reader.cpp>
    +<sensors/Aht10Reader.cpp>
    +<sensors/CompassReader.cpp>
    +<sensors/AccelReader.cpp>
    +<GpsReader.cpp>
    +<LogFormatter.cpp>
    +<../test/test_display_stream/main_stream.cpp>
lib_deps =
    adafruit/Adafruit BMP085 Library

[env:native_display]
platform = native
build_flags =
    -DNATIVE_DISPLAY
    -std=c++17
extra_scripts = pre:scripts/link_sdl3.py
build_src_filter =
    +<algorithms/NijntjeEvaluator.cpp>
    +<algorithms/MathUtils.cpp>
    +<display/NativeFramebuffer.cpp>
    +<display/BWFramebuffer.cpp>
    +<display/BWRenderer.cpp>
    +<display/SDL2Display.cpp>
    +<nijntje/NijntjeRenderer.cpp>
    +<nijntje/NijntjeSpriteRegistry.cpp>
    +<main_display_sim.cpp>
